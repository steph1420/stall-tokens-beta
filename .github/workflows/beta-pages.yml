# Publish the Beta channel of Stall Tokens (Q-CHANNEL A, Q-BETA-PATH B).
# Builds the PUBLIC source repo steph1420/stall-tokens at branch feat/v2.1.0. This repo holds no app code and no secrets.
# Stable (steph1420/stall-tokens, /stall-tokens/) is never touched from here.
name: Beta Pages
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source branch or commit in steph1420/stall-tokens
        default: feat/v2.1.0
  schedule:
    - cron: '30 0 * * *' # 06:00 IST daily
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: steph1420/stall-tokens
          ref: ${{ inputs.ref || 'feat/v2.1.0' }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Source commit for the footer stamp
        run: echo "VITE_GIT_SHA=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
      - run: npm ci
      - name: CI gate
        run: npm run check
        env:
          VITE_CHANNEL: beta
      # Since 2.1.0 P0 (F-49) the app sets its own channel, so this step only checks the build and changes nothing:
      # Beta title + manifest name, and the Beta storage prefix present in the JS (Beta never reads Stable's data).
      - name: Check Beta label + own storage
        run: |
          set -euo pipefail
          grep -q "<title>Stall Tokens Beta</title>" dist/index.html || { echo "title is not Beta"; exit 1; }
          grep -q '"name":"Stall Tokens Beta"' dist/manifest.webmanifest || { echo "manifest name is not Beta"; exit 1; }
          grep -rlq "stall-tokens-beta.v2" dist/assets || { echo "Beta storage prefix not in the build"; exit 1; }
          grep -rq 'VITE_CHANNEL:"beta"' dist/assets || { echo "build is not VITE_CHANNEL=beta"; exit 1; }
          grep -o "<title>[^<]*</title>" dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
